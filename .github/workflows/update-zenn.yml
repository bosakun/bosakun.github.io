name: Update Zenn articles

on:
  # 毎日 JST 6:00（UTC 21:00）に実行
  schedule:
    - cron: "0 21 * * *"
  # Actions タブから手動実行できるようにする
  workflow_dispatch:

permissions:
  contents: write

# 同時実行を防ぐ（手動実行と定期実行がかぶったときの対策）
concurrency:
  group: update-zenn
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Zenn feed
        run: python scripts/fetch_zenn.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/zenn.json
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: update Zenn articles"
            git push
          fi
